<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProGCharge</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="particles-js"></div>
    <div class="container">
      <h1>ProGCharge</h1>
      <div class="buttons">
        <button class="watt-button" data-watt="1">10W</button>
        <button class="watt-button" data-watt="2">13W</button>
        <button class="watt-button" data-watt="3">18W</button>
        <button class="watt-button" data-watt="4">22W</button>
        <button class="watt-button" data-watt="5">28W</button>
        <button class="watt-button" data-watt="6">33W</button>
        <button class="watt-button" data-watt="7">40W</button>
        <button class="watt-button" data-watt="8">46W</button>
        <button class="watt-button" data-watt="9">54W</button>
        <button class="watt-button" data-watt="10">61W</button>
        <button class="watt-button" data-watt="11">70W</button>
        <button class="watt-button" data-watt="12">78W</button>
        <button class="watt-button" data-watt="13">88W</button>
        <button class="watt-button" data-watt="14">97W</button>
        <button class="watt-button" data-watt="15">108W</button>
      </div>
      <div id="please-wait">Please wait...</div>
      <div id="warning-message">Values may not match device support.</div>
      <div id="watermark">RiProG-id</div>
    </div>
    <script src="particles.min.js"></script>
    <script src="particles-config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
